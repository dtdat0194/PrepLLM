services:
  # Backend API Service
  - type: web
    name: sat-practice-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npx prisma db push
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sat-practice-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: sat-practice-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://sat-practice-backend.onrender.com/api

databases:
  - name: sat-practice-db
    plan: free
